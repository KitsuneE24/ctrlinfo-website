<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Administration — CTRL INFO</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f7f5f2;
        color: #1a1a1a;
        font-family: system-ui, sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { line-height: 1.6; color: #555; }
      button {
        margin-top: 1rem;
        padding: 0.7rem 1.1rem;
        border: 0;
        border-radius: 0.6rem;
        background: #1800ad;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondaire { background: #fff; color: #1800ad; border: 2px solid #1800ad; }
      #etat { margin-top: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Administration</h1>
      <p>
        Tu es identifié. Ton navigateur garde l'identification : les
        enregistrements faits depuis le site passeront désormais.
      </p>
      <p>
        L'édition se fait <strong>sur le site lui-même</strong> — tu parcours les
        écrans et tu corriges les textes là où ils s'affichent.
      </p>
      <button id="activer">Activer l'édition et aller sur le site</button>
      <button id="desactiver" class="secondaire">Désactiver l'édition</button>
      <p id="etat"></p>
    </main>
    <script>
      const CLE = 'ctrl-info:admin'
      const etat = document.getElementById('etat')

      const dire = () => {
        const actif = localStorage.getItem(CLE) === '1'
        etat.textContent = actif ? 'Édition active.' : 'Édition inactive.'
      }

      document.getElementById('activer').addEventListener('click', () => {
        localStorage.setItem(CLE, '1')
        location.href = '../'
      })

      document.getElementById('desactiver').addEventListener('click', () => {
        localStorage.removeItem(CLE)
        dire()
      })

      dire()
    </script>
  </body>
</html>
